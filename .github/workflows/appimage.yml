name: AppImage

# Compila Boma come AppImage (Qt incluso: chi non ha Qt sul sistema non deve installarlo) e lo allega
# alla release di GitHub del tag vX.Y.Z. Si puo' lanciare anche a mano (resta un artefatto del job).
#
# Costruita in un container Arch Linux (Qt 6 aggiornata, con lo schema chiaro/scuro di sistema): l'AppImage
# richiede una glibc recente, come quella di Void o Arch; non parte su distribuzioni con glibc piu' vecchia.
# Dentro l'AppImage: Boma, Qt 6, la piattaforma Wayland/X11 e lo stile Adwaita
# (adwaita-qt6, compilato contro la stessa Qt, e' lo stile predefinito dell'AppImage).
# NON dentro: mbsync, mu, msmtp, gpg e python3, che Boma lancia come programmi separati e che
# devono essere installati sul sistema (su Void: isync mu4e msmtp gnupg python3).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1" # niente FUSE nel container
      NO_STRIP: "1" # lo strip di linuxdeploy non capisce le librerie recenti di Arch (.relr.dyn)
    steps:
      - uses: actions/checkout@v4

      - name: Dipendenze
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja pkgconf file wget github-cli \
            qt6-base qt6-wayland gmime3 adwaita-qt6

      - name: Compila
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --target boma
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Strumenti AppImage
        run: |
          wget -q -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt

      - name: Costruisce l'AppImage
        env:
          QMAKE: /usr/bin/qmake6
          LINUXDEPLOY_OUTPUT_VERSION: ${{ github.ref_name }}
        run: |
          export PATH="$PWD:$PATH"
          # il .desktop del pacchetto usa un'icona di tema (mail-client): qui serve quella inclusa
          sed -i 's/^Icon=.*/Icon=boma/' AppDir/usr/share/applications/boma.desktop
          ./linuxdeploy --appdir AppDir --plugin qt \
            --executable AppDir/usr/bin/boma \
            --desktop-file AppDir/usr/share/applications/boma.desktop \
            --icon-file packaging/appimage/boma.svg
          # stile Adwaita: il plugin e le sue librerie (lo stesso Qt dell'AppImage)
          style=$(pacman -Ql adwaita-qt6 | awk '{print $2}' | grep '/plugins/styles/.*\.so$' | head -n1)
          test -n "$style" || { echo "plugin dello stile Adwaita non trovato"; exit 1; }
          mkdir -p AppDir/usr/plugins/styles
          cp "$style" AppDir/usr/plugins/styles/
          ./linuxdeploy --appdir AppDir --deploy-deps-only AppDir/usr/plugins/styles
          ./linuxdeploy --appdir AppDir --output appimage
          ls -l Boma*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: boma-appimage
          path: Boma*.AppImage

      - name: Allega alla release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Boma ${tag#v}" --generate-notes
          gh release upload "$tag" Boma*.AppImage --clobber
