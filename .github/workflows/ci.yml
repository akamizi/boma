name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Dipendenze
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev libgmime-3.0-dev \
            maildir-utils isync msmtp gnupg

      - name: Configura
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compila
        run: cmake --build build

      # test_realtools usa mbsync/mu/gpg veri e sul runner mbsync non riesce a
      # leggere la propria configurazione (Permission denied): si prova in locale.
      - name: Test
        run: ctest --test-dir build --output-on-failure -E test_realtools

      - uses: actions/upload-artifact@v4
        with:
          name: boma-linux-x86_64
          path: build/boma

  # Un solo job (non una matrice): Debug con AddressSanitizer e UndefinedBehaviorSanitizer.
  # Un errore dei sanitizer e' un bug da correggere, non da zittire.
  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Dipendenze
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev libgmime-3.0-dev \
            maildir-utils isync msmtp gnupg

      - name: Configura
        run: |
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Compila
        run: cmake --build build-san

      - name: Test
        run: ctest --test-dir build-san --output-on-failure -E test_realtools
